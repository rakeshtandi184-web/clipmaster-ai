
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipMaster AI - Automatic Shorts</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#10172b;color:white;min-height:100vh;padding:25px 15px}
.card{width:min(680px,100%);margin:40px auto;background:#1b2540;padding:30px;border-radius:20px;box-shadow:0 15px 45px #0005}
h1{text-align:center;margin:0 0 8px;font-size:32px}
p{text-align:center;color:#b8c4df}
.drop{display:block;text-align:center;border:2px dashed #53678f;border-radius:14px;padding:30px;margin-top:25px;cursor:pointer}
.drop strong{display:block;font-size:18px;margin-bottom:10px}
input[type=file]{display:none}
input[type=url]{width:100%;padding:15px;border-radius:10px;border:1px solid #53678f;background:#10172b;color:white;margin-top:12px;font-size:15px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#7965ff;color:white;font-size:17px;font-weight:bold;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:18px;padding:13px;background:#10172b;border-radius:10px;text-align:center;color:#b8c4df;overflow-wrap:anywhere}
.results{margin-top:22px}
.results a{display:block;color:#a99aff;margin:12px 0;overflow-wrap:anywhere}
.small{font-size:12px;color:#8998b9}
</style>
</head>
<body>
<div class="card">
<h1>🎬 ClipMaster AI</h1>
<p>Turn Long Videos Into Amazing Shorts Automatically</p>

<label class="drop" for="video">
<strong>📁 Upload Your Video</strong>
<span id="filename">Choose MP4, MOV, MKV or WEBM</span>
</label>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">

<p>OR Paste Video Link</p>
<input type="url" id="videoUrl" placeholder="Paste YouTube, Facebook or Instagram URL">

<button class="btn" id="uploadBtn" onclick="uploadVideo()">Create Shorts 🚀</button>

<div class="status" id="status">Ready to create your shorts!</div>
<div class="results" id="results"></div>
<p class="small">ClipMaster AI • Automatic Video Clipping</p>
</div>

<script>
const API = "https://clipmaster-ai-t7y8.onrender.com";

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");
const btn = document.getElementById("uploadBtn");

video.addEventListener("change",()=>{
document.getElementById("filename").textContent =
video.files[0]?.name || "Choose a video";
});

async function uploadVideo(){
const file = video.files[0];
const url = document.getElementById("videoUrl").value.trim();

if(!file && !url){
statusBox.textContent="Please upload a video or paste a video link.";
return;
}

btn.disabled=true;
results.innerHTML="";
statusBox.textContent="⏳ Processing your video... Please wait.";

try{
let response;

if(file){
const formData=new FormData();
formData.append("file",file);
response=await fetch(API+"/api/create-shorts",{method:"POST",body:formData});
}else{
response=await fetch(API+"/api/create-shorts-from-url",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url:url})
});
}

const data=await response.json();

if(!response.ok){
throw new Error(data.detail || "Something went wrong");
}

statusBox.textContent="✅ Shorts created successfully!";

if(data.shorts && data.shorts.length){
data.shorts.forEach((path,index)=>{
const link=document.createElement("a");
link.href=API+path;
link.target="_blank";
link.download="";
link.textContent="⬇️ Download Short "+(index+1);
results.appendChild(link);
});
}else{
statusBox.textContent="No shorts were returned.";
}

}catch(error){
statusBox.textContent="❌ "+error.message;
}finally{
btn.disabled=false;
}
}
</script>
</body>
</html>
